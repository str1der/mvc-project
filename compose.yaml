services:
    nginx:
        image: nginx:stable-alpine3.24
        ports:
            - 8080:80
        volumes:
            - ./src:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - mvc-net
        depends_on:
            - php
        restart: unless-stopped

    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
        volumes:
             - ./src:/var/www/html
             - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
        networks:
             - mvc-net
        depends_on:
             - postgres
        restart: unless-stopped

    postgres:
        image: postgres:18
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql
        networks:
            - mvc-net
        restart: unless-stopped

volumes:
    postgres-data:

networks:
    mvc-net:
        driver: bridge
